name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend:
    name: Backend (Node/Express/Prisma)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: msme_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test_user -d msme_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/api/package-lock.json

      - name: Install dependencies
        working-directory: apps/api
        run: npm ci

      - name: Generate Prisma Client
        working-directory: apps/api
        run: npx prisma generate

      - name: Run database migrations
        working-directory: apps/api
        env:
          DATABASE_URL: postgresql://test_user:test_password@localhost:5432/msme_test?schema=public
        run: npx prisma migrate deploy

      - name: Type-check
        working-directory: apps/api
        run: npx tsc --noEmit

      - name: Run unit tests
        working-directory: apps/api
        run: npm test

      - name: Build
        working-directory: apps/api
        run: npm run build

  ai-service:
    name: AI Service (Python/FastAPI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: apps/ai-service
        run: pip install -r requirements-dev.txt

      - name: Run tests
        working-directory: apps/ai-service
        run: pytest tests/ -v

  frontend:
    name: Frontend (React/TypeScript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        working-directory: apps/web
        run: npm ci

      - name: Build
        working-directory: apps/web
        run: npm run build

  docker-build:
    name: Docker image build check
    runs-on: ubuntu-latest
    needs: [backend, ai-service, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Build API image
        run: docker build -t msme-api:ci ./apps/api

      - name: Build AI service image
        run: docker build -t msme-ai-service:ci ./apps/ai-service

      - name: Build frontend image
        run: docker build -t msme-web:ci ./apps/web
